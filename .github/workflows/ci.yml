name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ./build/adapter_tests
  audit:
    name: Static audits
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: No ONNX Runtime in the engine
        run: scripts/check_no_ort.sh
      - name: The ROCm plugin is built for exactly the architectures devices.cpp calls usable
        run: python3 scripts/check_rocm_archs.py
  goldens:
    name: The per-op goldens are what ONNX Runtime produces today
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Regenerate
        run: uv run tools/ggml_parity/gen_op_goldens.py
      - name: Unchanged
        run: git status --porcelain test/fixtures/ggml_ops | tee /dev/stderr | (! grep -q .)
