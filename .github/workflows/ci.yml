name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ./build/adapter_tests
  sanitizers:
    # The executor manages tensor memory by hand (one shared arena, views of the caller's buffers): a use-after-free there showed only
    # as an intermittent heap corruption in a host's test suite. Every test under AddressSanitizer and UBSan (minus nonnull-attribute:
    # upstream ggml memsets an empty hash set through a null pointer, which is harmless).
    name: Build and test under AddressSanitizer and UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: |
          F="-fsanitize=address,undefined -fno-sanitize=nonnull-attribute -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_FLAGS="$F" -DCMAKE_CXX_FLAGS="$F" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ASAN_OPTIONS=detect_leaks=1 ./build/adapter_tests
  audit:
    name: Static audits
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: No ONNX Runtime in the engine
        run: scripts/check_no_ort.sh
      - name: The ROCm plugin is built for exactly the architectures devices.cpp calls usable
        run: python3 scripts/check_rocm_archs.py
  goldens:
    name: The per-op goldens are what ONNX Runtime produces today
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Regenerate
        run: uv run tools/ggml_parity/gen_op_goldens.py
      - name: Unchanged
        run: git status --porcelain test/fixtures/ggml_ops | tee /dev/stderr | (! grep -q .)
