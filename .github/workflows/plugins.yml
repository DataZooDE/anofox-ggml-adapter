#
# The GPU backend plugins (plugin ABI v3), shared by every host extension: built here, published here, downloaded by the hosts from the
# release ANOFOX_GGML_PLUGIN_RELEASE_TAG names (include/anofox_ggml_adapter/plugin_artifacts.hpp), each with a sha256 sidecar.
#
# CUDA and ROCm are the ggml plugin (src/plugin_ggml.cpp, tools/ggml_plugin) built per vendor. None needs a GPU to BUILD; every push
# checks that the artifact resolves, exports the entry symbol, needs no shared CUDA runtime, and refuses cleanly without a GPU
# (tools/gpu_test/plugin_load_check.c). Running on real GPUs is the hosts' E2E (and ANOFOX_GGML_TEST_PLUGIN for this repo's plugin tests).
#
name: GPU plugins

# push only for main and release tags: a same-repo pull request would otherwise run every job twice (push and pull_request refs differ,
# so the concurrency group cannot deduplicate them)
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # release-asset upload on tags

jobs:
  ggml-cuda-plugin:
    name: ggml CUDA plugin (linux amd64, CUDA 12.8, static CUDA runtime)
    timeout-minutes: 180
    runs-on: ubuntu-22.04
    # CUDA 12.8 is the first toolkit with Blackwell (sm_100, sm_120). Runtime and cuBLAS are static: the user needs only the NVIDIA driver.
    # ggml's flash-attention kernels are not built: the lowering does not emit them, and they would multiply the plugin's size.
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - name: Tools
        run: apt-get update -qq && apt-get install -y -qq git cmake ninja-build binutils gcc
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build the plugin
        run: |
          cmake -S tools/ggml_plugin -B build/ggml-cuda -G Ninja -DCMAKE_BUILD_TYPE=Release -DANOFOX_GGML_GPU=cuda -DGGML_CUDA_NCCL=OFF \
            -DGGML_CUDA_FA=OFF "-DCMAKE_CUDA_ARCHITECTURES=75-real;80-real;86-real;89-real;90-real;100-real;120"
          cmake --build build/ggml-cuda
          cp build/ggml-cuda/libanofox_ggml-cuda_plugin.so .
          strip --strip-unneeded libanofox_ggml-cuda_plugin.so
      - name: Sanity - ABI symbol exported, no shared CUDA runtime needed, size
        run: |
          nm -D --defined-only libanofox_ggml-cuda_plugin.so | grep -q ' AnofoxGgmlGetPluginApi$' || { echo "ABI symbol missing"; exit 1; }
          bash scripts/check_plugin_deps.sh libanofox_ggml-cuda_plugin.so
          ls -l libanofox_ggml-cuda_plugin.so
          test "$(stat -c %s libanofox_ggml-cuda_plugin.so)" -lt 2000000000 || { echo "over GitHub's 2 GB release-asset limit"; exit 1; }
          sha256sum libanofox_ggml-cuda_plugin.so | tee ggml-cuda_plugin.sha256
      - name: Load check - dlopen answers and create fails gracefully without a GPU
        run: |
          gcc -O2 -o plugin_load_check tools/gpu_test/plugin_load_check.c -ldl
          # the plugin needs only the driver's libcuda.so.1; a build container has none, so the toolkit's stub stands in for it
          mkdir -p cuda-stub && ln -sf /usr/local/cuda/lib64/stubs/libcuda.so cuda-stub/libcuda.so.1
          LD_LIBRARY_PATH="$PWD/cuda-stub" ./plugin_load_check ./libanofox_ggml-cuda_plugin.so
      - uses: actions/upload-artifact@v4
        with:
          name: anofox-ggml-cuda-plugin
          path: |
            libanofox_ggml-cuda_plugin.so
            ggml-cuda_plugin.sha256
          if-no-files-found: error

  ggml-rocm-plugin:
    name: ggml ROCm plugin (linux amd64, ROCm 7.2, HIP)
    timeout-minutes: 240
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the HIP SDK from the ROCm apt repo
        run: |
          sudo mkdir -p /etc/apt/keyrings
          wget -qO- https://repo.radeon.com/rocm/rocm.gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.2.4 jammy main" | \
            sudo tee /etc/apt/sources.list.d/rocm.list
          # AMD's packages must win over Ubuntu's same-named ones (Ubuntu ships an unrelated rocm-device-libs 5.0.0): pin repo.radeon.com
          printf 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600\n' | sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update -qq
          sudo apt-get install -y -qq hipblas-dev rocblas-dev hip-dev rocm-llvm rocm-device-libs rocm-cmake ninja-build
      - name: Build the plugin
        # RDNA2..RDNA4 consumer cards and the APU iGPUs (gfx1150/1151 verified), plus CDNA data-center cards
        run: |
          export PATH=/opt/rocm/bin:/opt/rocm/lib/llvm/bin:$PATH ROCM_PATH=/opt/rocm HIP_PATH=/opt/rocm
          L=/opt/rocm/lib/llvm/bin
          BC=$(dirname "$(find /opt/rocm/ -name ocml.bc -print -quit)")
          echo "device libraries: $BC"; test -f "$BC/ocml.bc"
          cmake -S tools/ggml_plugin -B build/ggml-rocm -G Ninja -DCMAKE_BUILD_TYPE=Release -DANOFOX_GGML_GPU=hip -DGGML_HIP_NO_VMM=ON \
            -DCMAKE_CXX_COMPILER=$L/clang++ -DCMAKE_C_COMPILER=$L/clang -DCMAKE_HIP_COMPILER=$L/clang++ \
            "-DCMAKE_HIP_FLAGS=--rocm-path=/opt/rocm --rocm-device-lib-path=$BC" -DCMAKE_PREFIX_PATH=/opt/rocm \
            "-DAMDGPU_TARGETS=gfx1030;gfx1100;gfx1101;gfx1102;gfx1150;gfx1151;gfx1200;gfx1201;gfx90a;gfx942"
          cmake --build build/ggml-rocm -j4
          cp build/ggml-rocm/libanofox_ggml-rocm_plugin.so .
          strip --strip-unneeded libanofox_ggml-rocm_plugin.so
      - name: Sanity - ABI symbol exported
        run: |
          nm -D --defined-only libanofox_ggml-rocm_plugin.so | grep -q ' AnofoxGgmlGetPluginApi$' || { echo "ABI symbol missing"; exit 1; }
          readelf -d libanofox_ggml-rocm_plugin.so | grep NEEDED
          ls -l libanofox_ggml-rocm_plugin.so
          sha256sum libanofox_ggml-rocm_plugin.so | tee ggml-rocm_plugin.sha256
      - name: Load check - dlopen answers and create fails gracefully without a GPU
        run: |
          gcc -O2 -o plugin_load_check tools/gpu_test/plugin_load_check.c -ldl
          LD_LIBRARY_PATH=/opt/rocm/lib ./plugin_load_check ./libanofox_ggml-rocm_plugin.so
      - uses: actions/upload-artifact@v4
        with:
          name: anofox-ggml-rocm-plugin
          path: |
            libanofox_ggml-rocm_plugin.so
            ggml-rocm_plugin.sha256
          if-no-files-found: error

  publish:
    name: Attach the plugins to the release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ggml-cuda-plugin, ggml-rocm-plugin]
    timeout-minutes: 25
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: The pinned plugin release must be the one being published
        run: |
          # The hosts download from ANOFOX_GGML_PLUGIN_RELEASE_TAG: a release that does not point at itself would make every download
          # from a build of it fetch the previous release's plugins.
          pinned="$(sed -n 's/.*ANOFOX_GGML_PLUGIN_RELEASE_TAG = "\(.*\)".*/\1/p' include/anofox_ggml_adapter/plugin_artifacts.hpp)"
          echo "pinned: ${pinned}, tag: ${GITHUB_REF_NAME}"
          if [ "${pinned}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::ANOFOX_GGML_PLUGIN_RELEASE_TAG is '${pinned}' but this is '${GITHUB_REF_NAME}': bump it before tagging."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh release upload does not create the release object
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --repo "${GITHUB_REPOSITORY}" 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" \
            libanofox_ggml-cuda_plugin.so libanofox_ggml-rocm_plugin.so \
            ggml-cuda_plugin.sha256 ggml-rocm_plugin.sha256 \
            --repo "${GITHUB_REPOSITORY}" --clobber
